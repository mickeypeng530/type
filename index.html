<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VoiceReport 🩻</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222b38; --line:#2e3a4a;
    --text:#e6edf3; --muted:#8b97a7; --accent:#4da3ff; --ok:#3fd17a; --err:#ff4d5e; --hit:#e3b341;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;}
  body{max-width:1360px; margin:0 auto; padding:12px 12px 60px;}
  h1{font-size:17px; margin:2px 0 10px; font-weight:600;}
  h1 small{color:var(--muted); font-weight:400; font-size:12px;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  input[type=password],input[type=text],input[type=date],input[type=number],textarea,select{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:9px 10px; font-size:15px; outline:none; font-family:inherit;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  textarea{width:100%; line-height:1.45; resize:vertical;}
  button{border:none; border-radius:9px; padding:10px 15px; font-size:14px; font-weight:600;
    color:#fff; background:var(--accent); cursor:pointer;}
  button.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
  button.sm{padding:6px 11px; font-size:12.5px;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:13px; margin-bottom:12px;}
  .row{display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .status{font-size:13px; color:var(--muted); min-height:19px; margin-top:9px;}
  .status.ok{color:var(--ok);} .status.err{color:var(--err);}
  .hint{font-size:12px; color:var(--muted); line-height:1.5; margin-top:7px;}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; white-space:pre;}

  /* 登入 */
  #loginGate{max-width:420px; margin:14vh auto 0; text-align:center;}
  #loginGate .card{padding:22px;}
  #pw{width:100%; text-align:center; font-size:17px; letter-spacing:2px;}
  #pwBtn{width:100%; margin-top:10px; padding:13px; font-size:16px;}

  /* 頁籤 */
  header.top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  nav.tabs{display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:12px;}
  nav.tabs button{flex:1; border-radius:0; background:var(--panel2); color:var(--muted); font-size:14.5px; padding:12px 8px;}
  nav.tabs button.on{background:var(--accent); color:#fff;}
  section.tab{display:none;} section.tab.on{display:block;}

  /* 中興模板 */
  .tplbar{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:11px;}
  .tplbar button{background:var(--panel2); color:var(--text); border:1px solid var(--line); font-weight:500;}
  .tplbar button.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  #cxBody{min-height:600px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px;}
  .tplbar.variants{margin:-4px 0 11px 0;}
  .tplbar.variants button{font-size:12.5px; padding:6px 12px; border-radius:999px;}
  .extras{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
  .extras button{background:var(--panel2); color:var(--muted); border:1px dashed var(--line); font-size:12px; padding:6px 10px; font-weight:500;}
  .extras button:hover{color:var(--accent); border-color:var(--accent);}

  /* 結節表 */
  .tblwrap{overflow-x:auto; margin-top:10px;}
  table.nod{border-collapse:collapse; width:100%; min-width:620px;}
  table.nod th{font-size:11.5px; color:var(--muted); font-weight:600; text-align:left; padding:4px 5px;}
  table.nod td{padding:3px 5px;}
  table.nod input,table.nod select{padding:6px 7px; font-size:13.5px; border-radius:7px;}
  table.nod .no{color:var(--accent); font-family:ui-monospace,Consolas,monospace; font-weight:700; font-size:13px;}
  .gen2{display:grid; grid-template-columns:1fr 1.05fr; gap:16px; align-items:start;}
  .genOut textarea{min-height:190px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;}
  .genOut textarea.big{min-height:400px;}
  @media (max-width:1040px){ .gen2{grid-template-columns:1fr;} .genIn{order:-1;} }
  .badge{display:inline-block; font-size:12px; border-radius:999px; padding:3px 11px;
    background:rgba(227,179,65,.13); border:1px solid rgba(227,179,65,.4); color:var(--hit);}

  /* 短句 */
  #q{width:100%; font-size:16px; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .item{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:9px 11px; margin-bottom:9px;}
  .item.hit{border-color:var(--hit); box-shadow:0 0 0 1px var(--hit) inset;}
  .item .head{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .abbr{font-family:ui-monospace,Consolas,monospace; font-weight:700; color:var(--accent); font-size:14px;}
  .kind{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 6px;}
  .item pre{white-space:pre-wrap; margin:7px 0 0; font-size:13px; line-height:1.45;
    font-family:ui-monospace,Menlo,Consolas,monospace; max-height:170px; overflow:auto;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 9px;}
  .impLabel{font-size:11px; color:var(--ok); margin-top:7px; font-weight:600;}

  /* 口說 */
  #dictation{min-height:88px; font-size:16px;}
  #result{min-height:210px;} #impression{min-height:78px;}
  #result,#impression{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; white-space:pre;}
  #goBtn{width:100%; padding:16px; font-size:16px; margin-top:9px;}
  .pill{display:inline-block; font-size:12px; border-radius:999px; padding:4px 11px; margin:6px 6px 0 0;
    cursor:pointer; color:var(--muted); background:var(--panel2); border:1px solid var(--line);}
  .pill b{color:var(--accent); font-family:ui-monospace,Consolas,monospace;}
  .pill.on{color:var(--ok); background:rgba(63,209,122,.12); border-color:rgba(63,209,122,.35);}
  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:11px;}
  .seg button{flex:1; border-radius:0; background:var(--panel2); color:var(--muted); font-size:13.5px; padding:10px;}
  .seg button.on{background:var(--accent); color:#fff;}
  #impCard{display:none;}
</style>
</head>
<body>

<!-- ══════════ 登入(按鈕必須是靜態 HTML — iOS/popup 保險) ══════════ -->
<div id="loginGate">
  <h1 style="font-size:20px">VoiceReport 🩻</h1>
  <div class="card">
    <label>共用密碼</label>
    <input type="password" id="pw" placeholder="••••••" autocomplete="current-password">
    <button id="pwBtn">登入</button>
    <div class="hint">提示:intra</div>
    <div class="status" id="loginErr"></div>
    <details style="margin-top:10px">
      <summary style="cursor:pointer; color:var(--muted); font-size:12px">管理者登入</summary>
      <button class="ghost sm" id="googleBtn" style="margin-top:9px">用 Google 登入(可寫入)</button>
    </details>
  </div>
</div>

<!-- ══════════ App ══════════ -->
<div id="app" style="display:none">
  <header class="top">
    <h1 style="margin:0">VoiceReport <small id="srcInfo"></small></h1>
    <span style="flex:1"></span>
    <button class="ghost sm" id="logoutBtn">登出</button>
  </header>

  <nav class="tabs" id="tabNav">
    <button data-tab="cx" class="on">📋 中興模板</button>
    <button data-tab="snip">⌨️ 短句</button>
    <button data-tab="voice">🎤 口說</button>
  </nav>

  <!-- ───────── Tab 1:中興模板 ───────── -->
  <section class="tab on" id="tab-cx">
    <div class="tplbar" id="cxBar"></div>
    <div class="tplbar variants" id="cxVariants"></div>

    <!-- 一般模板:可編輯 textarea -->
    <div class="card" id="cxPlain">
      <label>模板內容(可直接改,改完複製)</label>
      <textarea id="cxBody" spellcheck="false"></textarea>
      <div class="row" style="margin-top:9px;">
        <button id="cxCopy">📋 複製</button>
        <button class="ghost sm" id="cxReset">↺ 還原原文</button>
        <span class="status" id="cxStatus"></span>
      </div>
      <div id="cxExtrasWrap" style="display:none">
        <div class="hint" style="margin-top:11px">選配句(點一下插入游標處):</div>
        <div class="extras" id="cxExtras"></div>
      </div>
    </div>

    <!-- LDCT 產生器:左=輸出可複製,右=輸入 -->
    <div class="card" id="cxLdct" style="display:none">
      <div class="gen2">
        <div class="genOut">
          <div class="row"><label style="margin:0">Findings</label><span style="flex:1"></span>
            <span id="ldRadsBadge"></span>
            <button class="sm" id="ldCopyF">📋 複製</button></div>
          <textarea id="ldFindings" class="big" spellcheck="false" placeholder="填好右邊欄位 → 按「產生報告」,結果出現在這裡"></textarea>
          <div class="row" style="margin-top:10px"><label style="margin:0">Impression</label><span style="flex:1"></span>
            <button class="sm" id="ldCopyI">📋 複製</button></div>
          <textarea id="ldImpression" spellcheck="false"></textarea>
          <div class="row" style="margin-top:10px">
            <label style="margin:0">Image No</label>
            <input type="text" id="ldImgNos" style="width:170px" readonly>
            <button class="ghost sm" id="ldCopyN">📋</button>
            <span class="status" id="ldStatus" style="margin:0"></span>
          </div>
        </div>

        <div class="genIn">
          <div class="row">
            <div><label>比較日期(空=無比較)</label><input type="date" id="ldDate"></div>
            <div><label>Series No</label><input type="text" id="ldSI" value="4" style="width:66px"></div>
            <div style="flex:1; min-width:230px"><label>Pleura</label>
              <select id="ldPleura" style="width:100%">
                <option value="0">No pleural effusion, thickening, or pneumothorax.</option>
                <option value="1">Pleural thickening at bilateral lung apices.</option>
              </select></div>
          </div>
          <div class="status" id="ldWarn"></div>

          <div class="tblwrap">
            <table class="nod">
              <thead><tr>
                <th style="width:24px"></th><th style="width:66px">大小 mm</th><th style="width:104px">位置</th>
                <th style="width:136px">型態</th><th style="width:70px">肺葉</th>
                <th style="width:104px">追蹤</th><th style="width:70px">Im No</th><th style="width:30px"></th>
              </tr></thead>
              <tbody id="ldRows"></tbody>
            </table>
          </div>

          <div class="row" style="margin-top:11px;">
            <button id="ldGenPlain">產生報告(一般版)</button>
            <button id="ldGenRads">產生(Lung-RADS)</button>
            <button class="ghost sm" id="ldAdd">+ 新增結節</button>
            <button class="ghost sm" id="ldClear">清空</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cardiac Ca 產生器:左=輸出可複製,右=輸入 -->
    <div class="card" id="cxCardiac" style="display:none">
      <div class="gen2">
        <div class="genOut">
          <div class="row"><label style="margin:0">Findings</label><span style="flex:1"></span>
            <button class="sm" id="caCopyF">📋 複製</button></div>
          <textarea id="caFindings" class="big" spellcheck="false" placeholder="填好右邊欄位 → 按「產生報告」,結果出現在這裡"></textarea>
          <div class="row" style="margin-top:10px"><label style="margin:0">Conclusion</label><span style="flex:1"></span>
            <button class="sm" id="caCopyC">📋 複製</button></div>
          <textarea id="caConclusion" spellcheck="false" style="min-height:70px"></textarea>
          <div class="status" id="caStatus"></div>
        </div>

        <div class="genIn">
          <div class="row">
            <div><label>LM</label><input type="text" id="caLM" class="caScore" style="width:76px"></div>
            <div><label>LAD</label><input type="text" id="caLAD" class="caScore" style="width:76px"></div>
            <div><label>LCX</label><input type="text" id="caCX" class="caScore" style="width:76px"></div>
            <div><label>RCA</label><input type="text" id="caRCA" class="caScore" style="width:76px"></div>
            <div><label>Total(自動加總,可覆寫)</label><input type="text" id="caTotal" style="width:110px"></div>
          </div>
          <div class="row" style="margin-top:9px">
            <div style="flex:1; min-width:240px"><label>心臟瓣膜</label>
              <select id="caValve" style="width:100%">
                <option value="0">The cardiac valves are not calcified.</option>
                <option value="1">Calcification of aortic valve.</option>
              </select></div>
          </div>
          <div class="row" style="margin-top:9px">
            <div style="flex:1; min-width:240px"><label>升主動脈</label>
              <select id="caAorta" style="width:100%">
                <option value="0">The visible ascending aorta is normal.</option>
                <option value="1">Dilatation of ascending aorta…</option>
              </select></div>
            <div id="caDiaWrap" style="display:none"><label>直徑 (cm)</label>
              <input type="text" id="caDia" style="width:76px"></div>
          </div>
          <div class="row" style="margin-top:11px">
            <button id="caGen">產生報告</button>
            <button class="ghost sm" id="caClear">清空</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ───────── Tab 2:短句 ───────── -->
  <section class="tab" id="tab-snip">
    <div class="card">
      <input id="q" placeholder="打縮寫(如 nln、ct2b)或關鍵字…  Enter=複製第一筆" autocomplete="off" spellcheck="false">
      <div class="row" style="margin-top:9px">
        <div class="seg" id="kindSeg" style="margin:0; width:auto">
          <button data-k="all" class="on" style="padding:8px 15px">全部</button>
          <button data-k="phrase" style="padding:8px 15px">短句</button>
          <button data-k="template" style="padding:8px 15px">模板</button>
        </div>
        <span class="status" id="snipStatus">就緒</span>
      </div>
    </div>
    <div id="snipResults"></div>
  </section>

  <!-- ───────── Tab 3:口說 ───────── -->
  <section class="tab" id="tab-voice">
    <div class="seg" id="modeSeg">
      <button data-mode="free">🆓 免費（選模板）</button>
      <button data-mode="api">🧠 智慧（自動填寫）</button>
    </div>

    <details class="card" id="cfgCard">
      <summary style="cursor:pointer; color:var(--muted); font-size:13px">⚙️ 設定（API,僅智慧模式需要）</summary>
      <div style="margin-top:11px;">
        <label>API Key（只存本機 localStorage）</label>
        <input type="password" id="apiKey" placeholder="sk-..." style="width:100%">
        <label style="margin-top:9px">API Base URL</label>
        <input type="text" id="apiBase" placeholder="https://api.openai.com/v1" style="width:100%">
        <label style="margin-top:9px">模型</label>
        <input type="text" id="apiModel" placeholder="gpt-5-mini" style="width:100%">
        <div class="row" style="margin-top:9px;">
          <button class="ghost sm" id="saveKey">儲存</button>
          <span class="status" id="keyStatus"></span>
        </div>
        <div class="hint">⚠️ 口述勿念病歷號／姓名。智慧模式文字會送往該 API 端點。</div>
      </div>
    </details>

    <div class="card">
      <label>① 口述內容（點框 → 鍵盤 🎤 說話,或打字;打縮寫如 ct2b 可直達）</label>
      <textarea id="dictation" placeholder="例:CT noncontrast brain, acute hemorrhage at right basal ganglia"></textarea>
      <button id="goBtn">🔍 產生報告</button>
      <div class="status" id="voiceStatus">準備就緒</div>
      <div id="matched"></div>
    </div>

    <div class="card">
      <label>② 報告結果 Findings（可直接編輯）</label>
      <textarea id="result" placeholder="結果會出現在這裡…"></textarea>
      <div class="row" style="margin-top:9px;">
        <button id="copyBtn">📋 複製 Findings</button>
        <button class="ghost sm" id="clearBtn">清空</button>
      </div>
    </div>

    <div class="card" id="impCard">
      <label>③ IMPRESSION（PACS 另一欄位）</label>
      <textarea id="impression"></textarea>
      <div class="row" style="margin-top:9px;">
        <button id="copyImpBtn">📋 複製 Impression</button>
      </div>
    </div>
  </section>
</div>

<!-- 本機開發資料(gitignored;線上版沒有這些檔 → 走雲端) -->
<!-- ?v= 版本戳:避免 index.html 與 JS 各自快取到不同版本(部署競態會造成
     「vrBuildIndex is not defined」這類錯誤)。改任一支 JS 就把版本號往上加。 -->
<script src="templates.js?v=6"></script>
<script src="phrases.js?v=6"></script>
<script src="cx-templates.js?v=6"></script>
<script src="matcher.js?v=6"></script>
<script src="report-gen.js?v=6"></script>

<script>
/* ══════════════════ 共用 ══════════════════ */
const $ = id => document.getElementById(id);
const DATA = { templates: [], phrases: [], cx: [] };
const LS = { key:"vr_openai_key", mode:"vr_mode", base:"vr_api_base", model:"vr_api_model",
             tab:"vr_tab", pref:"vr_pref", cxEdit:"vr_cx_" };
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function copyText(v, ta){
  try{ await navigator.clipboard.writeText(v); return true; }
  catch(_){                       // iOS Safari/PWA fallback
    const t = ta || document.createElement("textarea");
    if(!ta){ t.value=v; document.body.appendChild(t); }
    t.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    if(!ta) t.remove();
    return ok;
  }
}
function flash(el, msg, cls){
  el.textContent = msg; el.className = "status " + (cls||"ok");
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.textContent=""; el.className="status"; }, 1800);
}

/* ══════════════════ 啟動 ══════════════════ */
function boot(src, d){
  // 部署競態/快取不同步防呆:必要的 JS 沒載進來就明講並讓使用者重載,別吐神祕錯誤
  const missing = ["vrBuildIndex","vrPick","ldGenerate","caGenerate"].filter(f => typeof window[f] !== "function");
  if(missing.length) throw new Error("程式檔沒載齊(" + missing.join(", ") + ")— 請重新整理頁面");
  DATA.templates = d.templates || []; DATA.phrases = d.phrases || []; DATA.cx = d.cx || [];
  vrBuildIndex(DATA.templates);
  $("srcInfo").textContent = `${DATA.templates.length} 模板 · ${DATA.phrases.length} 短句 ${src==="cloud"?"☁️":"💻"}`;
  $("loginGate").style.display = "none";
  $("app").style.display = "";
  cxInit(); snipInit(); voiceInit();
  switchTab(localStorage.getItem(LS.tab) || "cx");
}
window.boot = boot;

function switchTab(t){
  localStorage.setItem(LS.tab, t);
  [...$("tabNav").children].forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-"+t));
  if(t === "snip") $("q").focus();
}
$("tabNav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(b) switchTab(b.dataset.tab);
});

/* ══════════════════ Tab 1:中興模板 ══════════════════ */
let cxCur = null, cxExtrasCur = [];
const cxGroups = () => {                      // [{group, name, generator, items:[…]}],保留檔案順序
  const m = new Map();
  for(const t of DATA.cx){
    if(!m.has(t.group)) m.set(t.group, {group:t.group, name:t.groupName || t.name,
                                        generator:t.generator, items:[]});
    m.get(t.group).items.push(t);
  }
  return [...m.values()];
};
function cxInit(){
  $("cxBar").innerHTML = cxGroups().map(g =>
    `<button data-group="${esc(g.group)}">${esc(g.name)}${g.generator?" ⚙️":""}</button>`).join("");
  const first = cxGroups()[0];
  if(first) cxSelectGroup(first.group);
}
$("cxBar").addEventListener("click", e => {
  const b = e.target.closest("button[data-group]"); if(b) cxSelectGroup(b.dataset.group);
});
$("cxVariants").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if(!b) return;
  localStorage.setItem("vr_cxvar_" + b.dataset.group, b.dataset.id);
  cxSelect(b.dataset.id);
});
function cxSelectGroup(group){
  const g = cxGroups().find(x => x.group === group); if(!g) return;
  const remembered = localStorage.getItem("vr_cxvar_" + group);
  const pick = g.items.find(i => i.id === remembered) || g.items[0];
  cxSelect(pick.id);
}
function cxSelect(id){
  const t = DATA.cx.find(x => x.id === id); if(!t) return;
  cxCur = t;
  [...$("cxBar").children].forEach(b => b.classList.toggle("on", b.dataset.group === t.group));
  const sibs = DATA.cx.filter(x => x.group === t.group);
  $("cxVariants").innerHTML = sibs.length > 1 ? sibs.map(v =>
    `<button data-id="${esc(v.id)}" data-group="${esc(v.group)}" class="${v.id===id?"on":""}">${esc(v.variant||v.name)}</button>`).join("") : "";
  const isLdct = t.id === "cx-ldct", isCa = t.id === "cx-cardiac";
  $("cxLdct").style.display = isLdct ? "" : "none";
  $("cxCardiac").style.display = isCa ? "" : "none";
  $("cxPlain").style.display = (isLdct || isCa) ? "none" : "";
  if(isLdct && !$("ldRows").children.length) ldReset();
  if(isLdct || isCa) return;
  // 暫存的編輯要綁「當時的原文」:上游模板改版後自動丟棄舊暫存,否則新模板永遠出不來
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS.cxEdit + t.id) || "null"); }catch(_){}
  if(saved && saved.base !== t.body){ localStorage.removeItem(LS.cxEdit + t.id); saved = null; }
  $("cxBody").value = saved ? saved.text : t.body;
  // extras 以 group 為單位合併(同標題只留一份),兩個變體都能插入同一組選配句
  const ex = []; const seen = new Set();
  for(const sib of DATA.cx.filter(x => x.group === t.group))
    for(const e of (sib.extras || [])) if(!seen.has(e.title)){ seen.add(e.title); ex.push(e); }
  cxExtrasCur = ex;
  $("cxExtrasWrap").style.display = ex.length ? "" : "none";
  $("cxExtras").innerHTML = ex.map((e,i) => `<button data-i="${i}">+ ${esc(e.title)}</button>`).join("");
}
$("cxBody").addEventListener("input", () => {
  if(!cxCur) return;
  if($("cxBody").value === cxCur.body) localStorage.removeItem(LS.cxEdit + cxCur.id);
  else localStorage.setItem(LS.cxEdit + cxCur.id,
        JSON.stringify({text: $("cxBody").value, base: cxCur.body}));
});
$("cxExtras").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]"); if(!b || !cxCur) return;
  const txt = cxExtrasCur[+b.dataset.i].text;
  const ta = $("cxBody"), p = ta.selectionStart ?? ta.value.length;
  const ins = (p > 0 && ta.value[p-1] !== "\n" ? "\n" : "") + txt + "\n";
  ta.value = ta.value.slice(0,p) + ins + ta.value.slice(p);
  ta.selectionStart = ta.selectionEnd = p + ins.length;
  ta.focus(); ta.dispatchEvent(new Event("input"));
});
$("cxCopy").onclick = async () =>
  flash($("cxStatus"), (await copyText($("cxBody").value, $("cxBody"))) ? "已複製 ✓" : "複製失敗",
        undefined);
$("cxReset").onclick = () => {

  flash($("cxStatus"), "已還原原文");
};

let SNIP = [], snipKind = "all", snipList = [];
const unfold = s => (s || "").replace(/\{tab\}/g, "\n");
function snipInit(){
  SNIP = [
    ...DATA.templates.map(t => ({id:t.id, kind:"template", name:t.name||"",
      text:unfold(t.findings||""), impression:unfold(t.impression||"")})),
    ...DATA.phrases.map(p => ({id:p.id, kind:"phrase", name:"", text:unfold(p.text||""), impression:""})),
  ];
  snipRender();
}
function snipSearch(qRaw){
  const q = qRaw.trim().toLowerCase();
  const pool = snipKind === "all" ? SNIP : SNIP.filter(i => i.kind === snipKind);
  if(!q) return {list: pool.slice(0,50), exact:false};
  const scored = [];
  for(const it of pool){
    const id = it.id.toLowerCase(); let s = 0;
    if(id === q) s = 1000;
    else if(id.startsWith(q)) s = 600 - id.length;
    else if(id.includes(q)) s = 300 - id.length;
    else if((it.name + " " + it.text).toLowerCase().includes(q)) s = 100;
    if(s) scored.push({it, s});
  }
  scored.sort((a,b) => b.s - a.s);
  return {list: scored.slice(0,60).map(x => x.it),
          exact: scored.length > 0 && scored[0].it.id.toLowerCase() === q};
}
function snipRender(){
  const {list, exact} = snipSearch($("q").value);
  snipList = list;
  if(!list.length){ $("snipResults").innerHTML = `<div class="hint">找不到:「${esc($("q").value)}」</div>`; return; }
  $("snipResults").innerHTML = list.map((it,i) => `<div class="item ${exact&&i===0?"hit":""}">
      <div class="head"><span class="abbr">${esc(it.id)}</span>
        <span class="kind">${it.kind==="template"?"模板":"短句"}</span>
        ${it.name?`<span style="font-size:13px">${esc(it.name)}</span>`:""}
        ${exact&&i===0?`<span style="font-size:11px;color:var(--hit);font-weight:600">⏎ 直達</span>`:""}</div>
      <pre>${esc(it.text)}</pre>
      ${it.impression?`<div class="impLabel">IMPRESSION ▼</div><pre>${esc(it.impression)}</pre>`:""}
      <div class="row" style="margin-top:8px">
        <button class="sm" data-copy="main" data-i="${i}">📋 複製${it.impression?" Findings":""}</button>
        ${it.impression?`<button class="ghost sm" data-copy="imp" data-i="${i}">📋 Impression</button>`:""}
      </div></div>`).join("");
}
$("q").addEventListener("input", snipRender);

let mode = localStorage.getItem(LS.mode) || "free";
let currentTpl = null, lastCands = [];
const tplById = id => DATA.templates.find(t => t.id === id);
const setVStatus = (m,c) => { const e=$("voiceStatus"); e.textContent=m; e.className="status "+(c||""); };
const getKey   = () => ($("apiKey").value   || localStorage.getItem(LS.key)   || "").trim();
const getBase  = () => ($("apiBase").value  || localStorage.getItem(LS.base)  || "https://api.openai.com/v1").trim().replace(/\/$/,"");
const getModel = () => ($("apiModel").value || localStorage.getItem(LS.model) || "gpt-5-mini").trim();

function voiceInit(){

  $("apiBase").value = localStorage.getItem(LS.base) || "";

function applyMode(){

const prefKey = c => c.slice(0,3).map(x => x.id).sort().join("|");
const getPrefs = () => { try{ return JSON.parse(localStorage.getItem(LS.pref) || "{}"); }catch(_){ return {}; } };
function savePref(c, id){ const p = getPrefs(); p[prefKey(c)] = id; localStorage.setItem(LS.pref, JSON.stringify(p)); }
function renderCandidates(cands, chosenId){
  lastCands = cands;
  $("matched").innerHTML = cands.slice(0,5).map(c =>
    `<span class="pill ${c.id===chosenId?"on":""}" data-id="${esc(c.id)}"><b>${esc(c.id)}</b> ${esc(c.name)}</span>`).join("");
}
function applyTemplate(tpl){
  currentTpl = tpl;
  $("result").value = tpl.findings;
  $("impression").value = tpl.impression || "";
  $("impCard").style.display = tpl.impression ? "block" : "none";
}
$("matched").addEventListener("click", e => {
  const p = e.target.closest(".pill"); if(!p) return;
  savePref(lastCands, p.dataset.id);
  applyTemplate(tplById(p.dataset.id));
  renderCandidates(lastCands, p.dataset.id);
  setVStatus("完成 ✓(已記住這個選擇)","ok");
});
$("goBtn").onclick = async () => {
  const text = $("dictation").value.trim();
  if(!text){ setVStatus("請先在①口述（或打字）","err"); $("dictation").focus(); return; }
  const {auto, candidates} = vrPick(text);
  if(!candidates.length){ setVStatus("選不到模板:「"+text+"」← 換個講法或打縮寫","err"); $("matched").innerHTML=""; return; }
  let chosen = auto ? tplById(auto.id) : null;
  if(!chosen){
    const pref = getPrefs()[prefKey(candidates)];
    if(pref && candidates.slice(0,5).some(c => c.id === pref)) chosen = tplById(pref);
  }
  renderCandidates(candidates, chosen ? chosen.id : null);
  if(!chosen){ setVStatus("有多個可能,點上面的候選模板選一個 ↑","err"); return; }
  if(mode === "free"){
    applyTemplate(chosen); renderCandidates(candidates, chosen.id);
    setVStatus("完成 ✓ 免費模式顯示模板原文;要自動翻陽性請用『智慧』","ok"); return;
  }
  if(!getKey()){ setVStatus("請先填 API key","err"); $("cfgCard").open = true; return; }
  try{
    setVStatus(`產生中(${getModel()})…`);
    const {report, impression} = await fillTemplate(chosen, text);
    currentTpl = chosen;
    $("result").value = report;
    $("impression").value = impression || chosen.impression || "";
    $("impCard").style.display = $("impression").value ? "block" : "none";
    renderCandidates(candidates, chosen.id);
    setVStatus("完成 ✓","ok");
  }catch(e){ setVStatus("錯誤:"+e.message,"err"); }
};
function buildSystemPrompt(tpl){
  return `You are a radiology report assistant for a non-native English speaker. The dictation may be mis-transcribed; map approximate words to the correct standard radiology term (e.g. hemorrhage, infarct, lymphadenopathy, effusion).

You are given ONE report template (an all-normal study) selected for this dictation.
Rules:
1. Start from the template text EXACTLY.
2. For each ABNORMAL finding dictated: if a matching normal/negative line exists, REWRITE that line into the positive finding with proper radiology phrasing; otherwise ADD a concise line in the correct section. Leave every other line unchanged, in original order.
3. Lines containing alternatives separated by " / " : choose the ONE alternative that matches the dictation and delete the rest (keep the line's prefix/bullet).
4. Blanks like "__" or "(  )": fill from the dictation if stated, otherwise keep as-is.
5. If a comparison/prior study is mentioned, fill the [Comparison with previous image] field; otherwise leave it.
6. Preserve exact line structure, headings, spacing and bullet style.
7. IMPRESSION section: update it to be consistent with the findings you changed (same style, concise).

Output a JSON object: {"report":"<final findings text>","impression":"<final impression text, empty string if template has none>"}. No extra commentary.

[TEMPLATE: ${tpl.name}]
FINDINGS:
"""
${tpl.findings}
"""
IMPRESSION:
"""
${tpl.impression||""}
"""`;
}
async function fillTemplate(tpl, transcript){
  const body = { model:getModel(), response_format:{type:"json_object"},
    messages:[{role:"system",content:buildSystemPrompt(tpl)},{role:"user",content:"Dictation: "+transcript}] };
  if(/^gpt-5/.test(getModel())) body.reasoning_effort = "minimal"; else body.temperature = 0.2;
  const r = await fetch(getBase()+"/chat/completions", {
    method:"POST", headers:{Authorization:"Bearer "+getKey(), "Content-Type":"application/json"},
    body: JSON.stringify(body) });
  if(!r.ok) throw new Error("API "+r.status+" "+(await r.text()).slice(0,140));
  const txt = (await r.json()).choices[0].message.content;
  try{ return JSON.parse(txt); }catch(_){ return {report:txt, impression:""}; }
}
$("copyBtn").onclick = async () => { const ok = await copyText($("result").value, $("result"));
  setVStatus(ok ? "Findings 已複製 ✓" : "複製失敗", ok ? "ok" : "err"); };
$("copyImpBtn").onclick = async () => { const ok = await copyText($("impression").value, $("impression"));
  setVStatus(ok ? "Impression 已複製 ✓" : "複製失敗", ok ? "ok" : "err"); };
$("clearBtn").onclick = () => { $("dictation").value=""; $("result").value=""; $("impression").value="";

<!-- ══════════ 雲端模式:登入 + 讀 RTDB(retake 模式:共用密碼帳號 / owner Google)══════════ -->
<script type="module">
import { fbAuth, fbDb, OWNER_UID, SHARED_UID, SHARED_EMAIL } from "./firebase-init.js";
import { GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const $ = id => document.getElementById(id);
const err = m => { $("loginErr").textContent = m; $("loginErr").className = "status err"; };

if(typeof TEMPLATES === "undefined"){          // 線上版才啟動 Firebase
  $("pwBtn").addEventListener("click", async () => {
    const pw = $("pw").value;
    if(!pw){ err("請輸入密碼"); return; }
    $("pwBtn").disabled = true; $("loginErr").textContent = "登入中…"; $("loginErr").className = "status";
    try{ await signInWithEmailAndPassword(fbAuth, SHARED_EMAIL, pw); }
    catch(e){
      err(/invalid-credential|wrong-password/.test(e.code) ? "密碼錯誤" : "登入失敗:"+e.code);
      $("pwBtn").disabled = false;
    }
  });
  $("pw").addEventListener("keydown", e => { if(e.key === "Enter") $("pwBtn").click(); });
  $("googleBtn").addEventListener("click", async () => {
    try{ await signInWithPopup(fbAuth, new GoogleAuthProvider()); }
    catch(e){ err("登入失敗:"+e.code); }
  });
  $("logoutBtn").addEventListener("click", () => signOut(fbAuth).then(() => location.reload()));

  onAuthStateChanged(fbAuth, async user => {
    if(!user){ $("loginGate").style.display = ""; $("app").style.display = "none"; return; }
    if(user.uid !== OWNER_UID && user.uid !== SHARED_UID){
      err("這個帳號沒有存取權"); await signOut(fbAuth); return;
    }
    $("loginErr").textContent = "載入資料中…"; $("loginErr").className = "status";
    try{
      const [t,p,c] = await Promise.all([
        get(ref(fbDb, "voiceReport/templates")),
        get(ref(fbDb, "voiceReport/phrases")),
        get(ref(fbDb, "voiceReport/cxTemplates")),
      ]);
      if(!t.exists()) throw new Error("雲端還沒有模板資料");
      window.boot("cloud", {templates: t.val(), phrases: p.val() || [], cx: c.val() || []});
    }catch(e){
      err("讀取失敗:"+(e.message || e.code));
      $("loginErr").insertAdjacentHTML("beforeend",
        ' <button class="ghost sm" onclick="location.reload()" style="margin-left:6px">↻ 重新載入</button>');
    }
  });
}else{
  $("logoutBtn").style.display = "none";       // 本機模式沒有登入可登出
}
</script>
