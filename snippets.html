<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snippets ⌨️ · VoiceReport</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222b38; --line:#2e3a4a;
    --text:#e6edf3; --muted:#8b97a7; --accent:#4da3ff; --ok:#3fd17a; --err:#ff4d5e; --hit:#e3b341;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;}
  body{max-width:820px; margin:0 auto; padding:14px 12px 60px;}
  h1{font-size:17px; margin:2px 0 10px; font-weight:600;}
  h1 small{color:var(--muted); font-weight:400; font-size:12px;}
  a.back{color:var(--accent); text-decoration:none; font-size:13px;}
  .bar{position:sticky; top:0; background:var(--bg); padding:8px 0 10px; z-index:5;}
  #q{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:12px; padding:14px 14px; font-size:17px; outline:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  #q:focus{border-color:var(--accent);}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .seg button{border:none; background:var(--panel2); color:var(--muted); font-size:13px; padding:7px 12px; cursor:pointer;}
  .seg button.on{background:var(--accent); color:#fff;}
  .tip{font-size:12px; color:var(--muted);}
  .status{font-size:13px; min-height:18px; color:var(--muted);}
  .status.ok{color:var(--ok);} .status.err{color:var(--err);}

  .item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px;}
  .item.hit{border-color:var(--hit); box-shadow:0 0 0 1px var(--hit) inset;}
  .item .head{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .abbr{font-family:ui-monospace,Consolas,monospace; font-weight:700; color:var(--accent); font-size:14px;}
  .kind{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 6px;}
  .name{font-size:13px; color:var(--text);}
  .hitflag{font-size:11px; color:var(--hit); font-weight:600;}
  pre{white-space:pre-wrap; margin:8px 0 0; font-size:13px; line-height:1.45;
    font-family:ui-monospace,Menlo,Consolas,monospace; max-height:180px; overflow:auto;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .btns{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  button.copy{border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; color:#fff; background:var(--accent); cursor:pointer;}
  button.copy.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
  button.copy:active{transform:translateY(1px);}
  .impLabel{font-size:11px; color:var(--ok); margin-top:8px; font-weight:600;}

  #loginCard{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; display:none;}
  #loginBtn{width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:600; color:#fff; background:var(--accent); cursor:pointer;}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px;}
</style>
</head>
<body>

<h1>Snippets <small>⌨️ 打縮寫 → Enter 複製 · 模板+短句 <span id="cnt">?</span> 條</small>
  &nbsp; <a class="back" href="index.html">← 回口述</a></h1>

<div id="loginCard">
  <label>短句庫在雲端(僅授權帳號可讀)</label>
  <button id="loginBtn">🔐 用 Google 登入載入</button>
  <div class="status" id="loginStatus"></div>
</div>

<div class="bar" id="tools" style="display:none">
  <input id="q" placeholder="打縮寫(如 nln、ct2b)或關鍵字…  Enter=複製第一筆" autocomplete="off" spellcheck="false">
  <div class="row">
    <div class="seg" id="kindSeg">
      <button data-k="all" class="on">全部</button>
      <button data-k="phrase">短句</button>
      <button data-k="template">模板</button>
    </div>
    <span class="status" id="status">就緒</span>
  </div>
</div>

<div id="results"></div>

<script src="templates.js"></script>
<script src="phrases.js"></script>
<script>
/* ============================ 資料 ============================ */
const $=id=>document.getElementById(id);
let ITEMS=[], kindFilter="all";

function fold(s){ return s.replace(/\{tab\}/g,"\n"); }   // 顯示/複製時把 {tab} 攤成換行

function buildItems(T,P){
  const out=[];
  for(const t of T) out.push({id:t.id, kind:"template", name:t.name||"",
    text:fold(t.findings||""), impression:fold(t.impression||"")});
  for(const p of P) out.push({id:p.id, kind:"phrase", name:"", text:fold(p.text||""), impression:""});
  return out;
}

/* ── 搜尋:縮寫精準 > 縮寫前綴 > 縮寫含 > 內文含 ── */
function search(qRaw){
  const q=qRaw.trim().toLowerCase();
  const pool = kindFilter==="all" ? ITEMS : ITEMS.filter(i=>i.kind===kindFilter);
  if(!q) return {list:pool.slice(0,50), exact:false};
  const scored=[];
  for(const it of pool){
    const id=it.id.toLowerCase();
    let s=0;
    if(id===q) s=1000;
    else if(id.startsWith(q)) s=600-id.length;
    else if(id.includes(q)) s=300-id.length;
    else if((it.name+" "+it.text).toLowerCase().includes(q)) s=100;
    if(s) scored.push({it,s});
  }
  scored.sort((a,b)=>b.s-a.s);
  const exact = scored.length>0 && scored[0].it.id.toLowerCase()===q;
  return {list:scored.slice(0,60).map(x=>x.it), exact};
}

/* ── 複製 ── */
async function copyText(v){
  try{ await navigator.clipboard.writeText(v); return true; }
  catch(_){ const ta=document.createElement("textarea"); ta.value=v; document.body.appendChild(ta);
    ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove(); return ok; }
}
function flash(msg){ const e=$("status"); e.textContent=msg; e.className="status ok";
  clearTimeout(flash._t); flash._t=setTimeout(()=>{ e.textContent="就緒"; e.className="status"; },1600); }

/* ── 渲染 ── */
let lastList=[];
function render(){
  const {list,exact}=search($("q").value);
  lastList=list;
  if(!list.length){ $("results").innerHTML=`<div class="tip" style="padding:8px">找不到:「${$("q").value}」</div>`; return; }
  const q=$("q").value.trim().toLowerCase();
  $("results").innerHTML=list.map((it,i)=>{
    const isHit = exact && i===0;
    const impBlock = it.impression
      ? `<div class="impLabel">IMPRESSION ▼</div><pre>${esc(it.impression)}</pre>` : "";
    const impBtn = it.impression
      ? `<button class="copy ghost" data-copy="imp" data-i="${i}">📋 Impression</button>` : "";
    return `<div class="item ${isHit?"hit":""}">
      <div class="head">
        <span class="abbr">${esc(it.id)}</span>
        <span class="kind">${it.kind==="template"?"模板":"短句"}</span>
        ${it.name?`<span class="name">${esc(it.name)}</span>`:""}
        ${isHit?`<span class="hitflag">⏎ 直達</span>`:""}
      </div>
      <pre>${esc(it.text)}</pre>${impBlock}
      <div class="btns">
        <button class="copy" data-copy="main" data-i="${i}">📋 複製${it.impression?" Findings":""}</button>
        ${impBtn}
      </div>
    </div>`;
  }).join("");
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

$("results").addEventListener("click", async e=>{
  const b=e.target.closest("button[data-copy]"); if(!b) return;
  const it=lastList[+b.dataset.i]; if(!it) return;
  const v = b.dataset.copy==="imp" ? it.impression : it.text;
  flash(await copyText(v) ? `已複製 ${it.id} ✓` : "複製失敗");
});

/* ── 事件 ── */
$("q").addEventListener("input", render);
$("q").addEventListener("keydown", async e=>{
  if(e.key==="Enter" && lastList[0]){ e.preventDefault();
    flash(await copyText(lastList[0].text) ? `已複製 ${lastList[0].id} ✓` : "複製失敗"); }
  if(e.key==="Escape"){ $("q").value=""; render(); }
});
$("kindSeg").addEventListener("click", e=>{
  const b=e.target.closest("button[data-k]"); if(!b) return;
  kindFilter=b.dataset.k;
  [...$("kindSeg").children].forEach(x=>x.classList.toggle("on", x===b));
  render();
});

/* ── 啟動 ── */
function hkBoot(){
  const T=(typeof TEMPLATES!=="undefined"?TEMPLATES:window.TEMPLATES)||[];
  const P=(typeof PHRASES!=="undefined"?PHRASES:window.PHRASES)||[];
  ITEMS=buildItems(T,P);
  $("cnt").textContent=ITEMS.length;
  $("loginCard").style.display="none";
  $("tools").style.display="";
  render();
  $("q").focus();
}
window.hkBoot=hkBoot;
const HAS_LOCAL = (typeof TEMPLATES!=="undefined" && typeof PHRASES!=="undefined");
if(HAS_LOCAL) hkBoot();
else $("loginCard").style.display="block";
</script>

<!-- 雲端模式:同 index.html 的 Firebase 登入(純 popup),讀 templates + phrases -->
<script type="module">
import { app, configReady } from "./firebase-config.js";
const $=id=>document.getElementById(id);
const say=(m,c)=>{ const e=$("loginStatus"); e.textContent=m; e.className="status "+(c||""); };

if(typeof TEMPLATES==="undefined"){
  if(!configReady){ say("firebase-config.js 還沒填設定","err"); }
  else{
    const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const { getDatabase, ref, get } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const auth=getAuth(app);
    $("loginBtn").addEventListener("click", async()=>{
      try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(err){ say("登入失敗:"+err.code,"err"); }
    });
    onAuthStateChanged(auth, async user=>{
      if(!user){ say("尚未登入"); return; }
      say("載入短句庫中……");
      try{
        const db=getDatabase(app);
        const [ts,ps]=await Promise.all([ get(ref(db,"voiceReport/templates")), get(ref(db,"voiceReport/phrases")) ]);
        if(!ts.exists()) throw new Error("雲端還沒有資料");
        window.TEMPLATES=ts.val(); window.PHRASES=ps.val()||[];
        window.hkBoot();
      }catch(e){ say("讀取失敗:"+(e.message||e.code)+"(帳號沒權限?)","err"); }
    });
  }
}
</script>
</body>
</html>
